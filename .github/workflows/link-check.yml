name: Site Quality Checks

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "en.html"
      - "scripts/check_links.py"
      - "scripts/check_bilingual.py"
      - "assets/**"
      - "site.webmanifest"
      - "robots.txt"
      - "sitemap.xml"
      - "404.html"
      - "scripts/visual_smoke.py"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check bilingual structural parity
        run: python scripts/check_bilingual.py
      - name: Check external links
        run: python scripts/check_links.py


  visual-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local site
        run: |
          python -m http.server 8000 > /tmp/perjadin-http.log 2>&1 &
          sleep 2
      - name: Run visual smoke tests
        run: python scripts/visual_smoke.py
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-screenshots
          path: artifacts/visual
          if-no-files-found: ignore
