name: Site Quality Checks

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "en.html"
      - "scripts/check_links.py"
      - "scripts/check_bilingual.py"
      - "assets/site.js"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check bilingual structural parity
        run: python scripts/check_bilingual.py
      - name: Check external links
        run: python scripts/check_links.py
