name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-v2"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public social preview endpoints
        continue-on-error: true
        shell: bash
        run: |
          set -u
          sleep 8
          echo "Checking custom domain with a social-crawler user agent..."
          if curl -fL --retry 3 --retry-delay 5 --max-time 25 -A "facebookexternalhit/1.1" https://perjadin.site/ -o /tmp/perjadin-home.html; then
            grep -q 'property="og:title"' /tmp/perjadin-home.html && echo "og:title found"
            grep -q 'property="og:image"' /tmp/perjadin-home.html && echo "og:image found"
          else
            echo "::warning::Custom domain could not be fetched after deployment. Check DNS/custom-domain/HTTPS settings."
          fi
          if curl -fL --retry 3 --retry-delay 5 --max-time 25 -A "facebookexternalhit/1.1" https://raw.githubusercontent.com/wongkito80/perjadin-site/main/assets/og-perjadin.png -o /tmp/og-perjadin.png; then
            test -s /tmp/og-perjadin.png && echo "Open Graph image endpoint is reachable"
          else
            echo "::warning::Open Graph image endpoint could not be fetched."
          fi
